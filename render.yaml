# ==============================================================================
# Blueprint para despliegue en Render (https://render.com)
# Documentación oficial de Blueprints: https://render.com/docs/blueprint-spec
# ==============================================================================
version: "1"

databases:
  # Base de datos PostgreSQL gestionada en Render
  - name: case-db
    databaseName: case_db
    user: case_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # Backend: API Spring Boot 3 + Java 21 (Web Service con Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: case-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: case-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: case-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: case-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: case-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: case-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "480"
      - key: CORS_ALLOWED_ORIGINS
        # Configurar con la URL de tu frontend, por ejemplo:
        # https://case-frontend.onrender.com
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xss512k"

  # ----------------------------------------------------------------------------
  # Frontend: SPA React 19 + TypeScript + Vite (Static Site - CDN gratuito)
  # ----------------------------------------------------------------------------
  - type: web
    name: case-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Configurar con la URL de tu backend, por ejemplo:
        # https://case-backend.onrender.com
        sync: false
